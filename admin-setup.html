<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تهيئة حساب المدير | منصة الكيمياء</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#111;color:#f5f0e8;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,460px);padding:28px;border:1px solid #8f7446;border-radius:18px;background:#1c1b19;box-shadow:0 18px 60px #0008}h1{font-size:23px;margin:0 0 8px;color:#e4c68d}p{color:#c4bba9;line-height:1.8;font-size:14px}.field{margin:18px 0}label{display:block;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid #514a3e;border-radius:10px;background:#111;color:#fff;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#c6a46a;color:#17130c;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.6}#msg{margin-top:14px;padding:12px;border-radius:9px;display:none;line-height:1.7}.hint{font-size:12px;color:#a99d88}
</style>
</head>
<body><main class="card">
<h1>تهيئة حساب مدير المنصة</h1>
<p>هذه الصفحة مخصصة لإعداد حساب المدير الأساسي للمنصة. أدخل قيمة <b>ADMIN_SETUP_KEY</b> الموجودة في Cloudflare، ثم عيّن كلمة مرور جديدة.</p>
<p><b>البريد:</b> auvb2010@outlook.com<br><b>الاسم:</b> الأستاذ حسين العباس</p>
<form id="setup">
<div class="field"><label for="key">مفتاح الإعداد (ADMIN_SETUP_KEY)</label><input id="key" type="password" autocomplete="off" required></div>
<div class="field"><label for="password">كلمة مرور المدير الجديدة</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><div class="hint">8 أحرف على الأقل إذا كان الحساب موجوداً، و12 حرفاً على الأقل إذا كان سيتم إنشاؤه.</div></div>
<button id="submit" type="submit">تفعيل / إصلاح حساب المدير</button>
</form><div id="msg" role="status"></div>
</main>
<script>
document.getElementById('setup').addEventListener('submit',async e=>{
 e.preventDefault();const b=document.getElementById('submit'),m=document.getElementById('msg');
 b.disabled=true;b.textContent='جارٍ التحقق...';m.style.display='none';
 try{const r=await fetch('/api/admin/bootstrap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({setupKey:document.getElementById('key').value,password:document.getElementById('password').value})});
 const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر إعداد الحساب');
 m.textContent=d.message||'تم إعداد الحساب. يمكنك تسجيل الدخول الآن.';m.style.display='block';m.style.background='#243729';m.style.color='#c7f4d1';
 }catch(err){m.textContent=err.message;m.style.display='block';m.style.background='#442525';m.style.color='#ffd1d1';}
 finally{b.disabled=false;b.textContent='تفعيل / إصلاح حساب المدير';}
});
</script></body></html>
